---
- name: Setup servers.
  hosts: prod
  become: true
  tasks:
    - name: Update apt cache.
      ansible.builtin.apt:
        update_cache: true

    - name: Upgrade all apps in image.
      ansible.builtin.apt:
        upgrade: full

    - name: Install Docker.
      ansible.builtin.include_role:
        name: geerlingguy.docker

    - name: Install resolvconf on Debian 12+.
      ansible.builtin.apt:
        name: resolvconf
        state: present
      when:
        - ansible_facts['os_family'] == 'Debian'
        - ansible_facts['distribution_major_version'] | int >= 12
      notify: Restart Debian 12+ servers.
  handlers:
    - name: Restart Debian 12+ servers.
      ansible.builtin.reboot:
        reboot_timeout: 600
        msg: "Reboot to propagate Proxmox host DNS settings to resolvconf."

- name: Install InfluxDB.
  hosts: influxdb
  tasks:
    - name: Install pip for plugins.
      ansible.builtin.apt:
        name:
          - pip
          - virtualenv
        state: present

    - name: Create InfluxDB directories.
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: 1500
        group: 1500
        mode: '0770'
      loop:
        - "{{ influxdb_dir }}"
        - "{{ influxdb_dir }}/config"
        - "{{ influxdb_dir }}/data"

    - name: Template .env file.
      ansible.builtin.template:
        src: templates/influxdb2/.env.j2
        dest: "{{ influxdb_dir }}/.env"
        mode: '0660'

    - name: Pull InfluxDB image.
      community.docker.docker_image:
        name: influxdb:2
        source: pull

    - name: Create InfluxDB container.
      community.docker.docker_container:
        name: influxdb
        image: influxdb:2
        env_file: "{{ influxdb_dir }}/.env"
        state: started
        restart_policy: unless-stopped
        ports:
          - "8086:8086"
        volumes:
          - "{{ influxdb_dir }}/config:/etc/influxdb2"
          - "{{ influxdb_dir }}/data:/var/lib/influxdb2"

- name: Install Traefik.
  hosts: traefik
  tasks:
    - name: Create Traefik directory.
      ansible.builtin.file:
        path: "{{ traefik_dir }}"
        state: directory
        mode: '0770'

    - name: Create Traefik env file from template.
      ansible.builtin.template:
        src: templates/traefik/traefik.env.j2
        dest: "{{ traefik_dir }}/traefik.env"
        mode: '0644'

    - name: Copy Traefik static config.
      ansible.builtin.copy:
        src: files/traefik/traefik.yaml
        dest: "{{ traefik_dir }}/traefik.yaml"
        mode: '0644'

    - name: Copy Traefik dynamic config.
      ansible.builtin.copy:
        src: files/traefik/dynamic/
        dest: "{{ traefik_dir }}/dynamic/"
        mode: '0770'

    - name: Install Traefik.
      ansible.builtin.include_role:
        name: traefik


- name: Install Pocket ID.
  hosts: pocket-id
  tasks:
    - name: Create Pocket-Id root and data directory.
      ansible.builtin.file:
        path: "{{ pocket_id_data_dir }}"
        state: directory
        mode: '0770'

    - name: Copy docker-compose file.
      ansible.builtin.copy:
        src: files/pocket-id/docker-compose.yml
        dest: "{{ pocket_id_dir }}/docker-compose.yml"
        mode: '0770'

    - name: Template .env file.
      ansible.builtin.template:
        src: templates/pocket-id/.env.j2
        dest: "{{ pocket_id_dir }}/.env"
        mode: '0660'

    - name: Start with docker-compose.
      community.docker.docker_compose_v2:
        project_src: "{{ pocket_id_dir }}"
        state: present

- name: Install immich
  hosts: immich
  tasks:
      # See https://github.com/jemalloc/jemalloc/issues/1328
    - name: Enable memory overcommit workaround for immich_redis
      ansible.posix.sysctl:
        name: vm.overcommit_memory
        value: 1
      become: true

    - name: Install immich
      ansible.builtin.include_role:
        name: immich

- name: Install mealie
  hosts: mealie
  tasks:
    - name: Create mealie directory.
      ansible.builtin.file:
        path: "{{ mealie_dir }}"
        state: directory
        mode: "0660"

    - name: Copy docker-compose file.
      ansible.builtin.copy:
        src: files/mealie/docker-compose.yml
        dest: "{{ mealie_dir }}/docker-compose.yml"
        mode: "0660"

    - name: Template .env file.
      ansible.builtin.template:
        src: templates/mealie/.env.j2
        dest: "{{ mealie_dir }}/.env"
        mode: "0660"

    - name: Deploy Mealie with docker-compose.
      community.docker.docker_compose_v2:
        project_src: "{{ mealie_dir }}"
        state: present

- name: Install OpenCloud.
  hosts: opencloud
  tasks:
    - name: Create OpenCloud directories.
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0660'
        group: root
        owner: root
      loop:
        - "{{ opencloud_config_dir }}"
        - "{{ opencloud_data_dir }}"
        - "{{ radicale_data_dir }}"

    - name: Copy OpenCloud directory.
      ansible.builtin.copy:
        src: files/opencloud/
        dest: "{{ opencloud_dir }}/"
        mode: "0660"
        group: root
        owner: root

    - name: Template .env file.
      ansible.builtin.template:
        src: templates/opencloud/.env.j2
        dest: "{{ opencloud_dir }}/.env"
        mode: "0660"
        group: root
        owner: root

    - name: Deploy OpenCloud with docker-compose.
      community.docker.docker_compose_v2:
        project_src: "{{ opencloud_dir }}"
        state: present
        files:
          - docker-compose.yml
          - external-proxy/opencloud-exposed.yml
          - radicale/radicale.yml
          - idm/external-idp.yml
        env_files:
          - .env

- name: Install paperless
  hosts: paperless
  tasks:
    - name: Create paperless directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ paperless_dir }}/data"
        - "{{ paperless_media_dir }}"
        - "{{ paperless_dir }}/export"
        - "{{ paperless_dir }}/consume"

    - name: Copy docker-compose file.
      ansible.builtin.copy:
        src: files/paperless/docker-compose.yaml
        dest: "{{ paperless_dir }}/docker-compose.yml"
        mode: "0660"

    - name: Template .env file.
      ansible.builtin.template:
        src: templates/paperless/.env.j2
        dest: "{{ paperless_dir }}/.env"
        mode: "0660"

    - name: Deploy Paperless-ngx with docker-compose.
      community.docker.docker_compose_v2:
        project_src: "{{ paperless_dir }}"
        state: present

