services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2-distroless
    restart: unless-stopped
    env_file: .env
    ports:
      - 1411:1411
    volumes:
      - "${DATA_LOCATION}:/app/data"
    read_only: true
    user: '1000:1000'
    healthcheck:
      test: [ "CMD", "/app/pocket-id", "healthcheck" ]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
